<ion-tabs>
  <ion-tab-bar slot="bottom" class="custom-tab-bar">
    <ion-tab-button tab="tab1">
      <ion-icon name="home"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>
    
    <ion-tab-button tab="tab2">
      <ion-icon name="person"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>
    
    <ion-tab-button tab="tab3">
      <ion-icon name="chatbubbles"></ion-icon>
      <ion-label>Messages</ion-label>
    </ion-tab-button>
    
    <ion-tab-button tab="tab4">
      <ion-icon name="settings"></ion-icon>
      <ion-label>Settings</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>

<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Discover
    </ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon slot="icon-only" name="search-outline"></ion-icon>
      </ion-button>
      <ion-button>
        <ion-icon slot="icon-only" name="heart-outline"></ion-icon>
      </ion-button>
      <ion-button>
        <ion-icon slot="icon-only" name="cart-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="header-container">
    <h1>Trending Products</h1>
    <p>Discover our premium collection</p>
  </div>

  <div class="product-grid">
    <ion-card *ngFor="let product of products" class="product-card">
      <div class="image-container">
        <img [src]="product.image" [alt]="product.name">
        <div class="price-tag">${{ product.price.toFixed(2) }}</div>
        <div class="discount-badge" *ngIf="product.id % 2 === 0">-20%</div>
      </div>
      <ion-card-header>
        <ion-card-title>{{ product.name }}</ion-card-title>
        <div class="rating">
          <ion-icon name="star" *ngFor="let star of getStarArray(product.rating)"></ion-icon>
          <span>{{ product.rating }} ({{ 10 + product.id * 5 }} reviews)</span>
        </div>
      </ion-card-header>
      <ion-card-content>
        <p>{{ product.description }}</p>
        <div class="product-meta">
          <div class="stock">In Stock</div>
          <ion-icon name="heart-outline" class="wishlist"></ion-icon>
        </div>
        <ion-button expand="block" shape="round">
          Add to Cart
          <ion-icon slot="end" name="bag-add-outline"></ion-icon>
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
